name: Release to NuGet

on:
  push:
    branches: main

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run when the triggering commit message contains [release]
    if: contains(github.event.head_commit.message, '[release]')
    permissions:
      id-token: write  # required to request the OIDC token for NuGet Trusted Publishing
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./nupkgs
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: sajink
    - name: Push to NuGet
      run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

